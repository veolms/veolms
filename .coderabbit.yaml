reviews:
  # Temporary review batch: styles, configuration, and integration contracts.
  # This scope is reverted after the oversized pull request is fully reviewed.
  path_filters:
    - "!apps/web/src/**/*.ts"
    - "!apps/web/src/**/*.tsx"
    - "apps/web/src/notifications/**/*.ts"
    - "apps/web/src/notifications/**/*.tsx"
    - "apps/web/src/services/auth/**/*.ts"
    - "!apps/web/tests/**"
  auto_review:
    enabled: true
    auto_incremental_review: true
    base_branches:
      - "development"
