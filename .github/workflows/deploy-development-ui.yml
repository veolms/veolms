name: Deploy development UI

on:
  push:
    branches:
      - development
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
      - "packages/database/**"
      - "packages/config/**"
      - "packages/storage/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-development-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-development-ui
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development
      url: https://dev.veolms.org

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check web application
        run: pnpm --filter @veolms/web typecheck

      - name: Run web unit tests
        run: pnpm --filter @veolms/web test:unit

      - name: Build web application without an external CDN URL
        if: ${{ vars.VITE_CDN_URL == '' && vars.CDN_URL == '' }}
        run: pnpm build:web

      - name: Build web application with the configured CDN URL
        if: ${{ vars.VITE_CDN_URL != '' || vars.CDN_URL != '' }}
        run: pnpm build:web
        env:
          VITE_CDN_URL: ${{ vars.VITE_CDN_URL || vars.CDN_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: veolms-development-ui-${{ github.run_id }}

      - name: Upload application assets to S3
        shell: bash
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          aws s3 sync apps/web/build/client "s3://${AWS_S3_BUCKET}" \
            --delete \
            --exclude "index.html" \
            --exclude "course-videos/" \
            --exclude "course-videos/*" \
            --cache-control "public,max-age=300,must-revalidate" \
            --only-show-errors

      - name: Upload entry document last
        shell: bash
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          aws s3 cp apps/web/build/client/index.html "s3://${AWS_S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --only-show-errors

      - name: Invalidate CloudFront cache
        shell: bash
        env:
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"

          aws cloudfront wait invalidation-completed \
            --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"
