packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@tiptap/core@3.30.1"
catalog:
  zod: "^4.4.3"
  kysely: "^0.29.4"
  "@typescript/native": "npm:typescript@^7.0.2"

# Turbo starts persistent workspace scripts concurrently. Keep dependency
# installation explicit so parallel dev tasks cannot race while relinking.
verifyDepsBeforeRun: false
